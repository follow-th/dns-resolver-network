services:
  server:
    image: ghcr.io/follow-th/dns-resolver-network-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DRN_ALLOW: "*"
      # SHA-256 hashes from `server keygen`, comma separated.
      DRN_CLIENT_KEYS: "<client key hash>"
      DRN_AGENT_KEYS: "<agent key hash>"
    # To use a YAML file instead, create server.yaml next to this file and uncomment:
    # command: ["-config", "/etc/drn/server.yaml"]
    # volumes:
    #   - ./server.yaml:/etc/drn/server.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
