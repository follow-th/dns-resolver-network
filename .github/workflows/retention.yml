name: image-retention

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [dns-resolver-network-server, dns-resolver-network-agent]
    steps:
      # Remove untagged versions (for example the per-architecture manifests of old images).
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
      # Keep the newest 20 other versions; latest and version tags (v1.2.3, 1.2.3, 1.2) are never deleted.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 20
          ignore-versions: '^(latest|v?[0-9]+\.[0-9]+(\.[0-9]+)?.*)$'
