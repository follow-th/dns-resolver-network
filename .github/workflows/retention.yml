name: image-retention

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [dns-resolver-network-server, dns-resolver-network-agent]
    steps:
      # ghcr-cleanup-action understands image indexes: platform manifests and attestations
      # referenced by a kept tag are never treated as untagged.
      # latest and version tags (v1.2.3, 1.2.3, 1.2) are never deleted; of the other tagged
      # images the newest 20 are kept; untagged images that no tag references are deleted.
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ matrix.package }}
          use-regex: true
          exclude-tags: '^(latest|v?[0-9]+\.[0-9]+(\.[0-9]+)?.*)$'
          keep-n-tagged: 20
          delete-untagged: true
          validate: true
